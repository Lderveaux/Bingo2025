
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>De miniprijs-maxipret-iedereenblij Pocket Bingo!</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: linear-gradient(to bottom, #fff8e1, #ffe0b2);
      margin: 0;
      padding: 0;
    }

    h1 {
      margin-top: 20px;
    }

    p {
      font-style: italic;
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      max-width: 600px;
      margin: 20px auto;
      padding: 10px;
    }

    .cell {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2em;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
      box-sizing: border-box;
    }

    .getrokken {
      font-weight: bold;
      color: white;
      background-color: #ff5722;
      border-radius: 50%;
      padding: 10px;
      box-shadow: 0 0 10px #ff5722;
      animation: pulse 0.5s ease;
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://i.imgur.com/4ca4EFj.jpeg');
      background-size: cover;
      background-position: center;
      backdrop-filter: blur(2px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 1s ease;
      overflow: hidden;
    }

    .overlay-content {
      position: relative;
      z-index: 2;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
      animation: pulse 2s infinite;
      max-width: 90%;
      text-align: center;
    }

    .overlay-content h2 {
      font-size: 2em;
      color: #ffe066;
      text-shadow: 0 0 10px #ffcc00;
      margin: 0;
    }

    .magic {
      color: #ff6ec7;
      text-shadow: 0 0 15px #ff6ec7;
      font-weight: bold;
    }

    /* Falling bingo balls */
    #ballLayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .ball {
      position: absolute;
      top: -60px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.95em;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
      box-shadow:
        inset -4px -4px 8px rgba(0,0,0,0.25),
        inset 3px 3px 6px rgba(255,255,255,0.5),
        0 4px 6px rgba(0,0,0,0.3);
      animation-name: fall, spin;
      animation-timing-function: linear, linear;
      animation-iteration-count: infinite, infinite;
    }

    @keyframes fall {
      0%   { transform: translateY(-10vh); }
      100% { transform: translateY(115vh); }
    }

    @keyframes spin {
      0%   { rotate: 0deg; }
      100% { rotate: 360deg; }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ball {
        animation: none;
        display: none;
      }
    }

    @media (max-width: 600px) {
      .cell {
        font-size: 1em;
      }

      .overlay-content {
        padding: 20px;
        font-size: 1em;
        max-width: 90%;
        word-wrap: break-word;
      }

      .overlay-content h2 {
        font-size: 1.4em;
        line-height: 1.3;
      }

      .magic {
        font-size: 1.5em;
      }

      .ball {
        width: 34px;
        height: 34px;
        font-size: 0.75em;
      }
    }
  </style>

  <!-- Firebase compat SDK’s -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAX3RaXLAOb3i9uCS8wqbJNvhzpTlASaWI",
      authDomain: "bingolive-2b326.firebaseapp.com",
      databaseURL: "https://bingolive-2b326-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "bingolive-2b326",
      storageBucket: "bingolive-2b326.appspot.com",
      messagingSenderId: "269555410215",
      appId: "1:269555410215:web:c7fba454ebd510f1c2b502",
      measurementId: "G-GFSYKPWQ7M"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let spelGestart = false;
    let nummers = {};

    function updateOverlay() {
      const overlay = document.getElementById("overlay");
      const bingoContainer = document.getElementById("bingoContainer");
      const geenNummersGetrokken = !nummers || Object.values(nummers).every(v => v === false);

      if (!spelGestart && geenNummersGetrokken) {
        overlay.style.display = "flex";
        bingoContainer.style.display = "none";
      } else {
        overlay.style.display = "none";
        bingoContainer.style.display = "block";
      }
    }

    // Classic bingo ball colours (B-I-N-G-O style palette)
    const BAL_KLEUREN = ["#e53935", "#1e88e5", "#43a047", "#fdd835", "#8e24aa", "#fb8c00"];

    function maakVallendeBallen(aantal = 18) {
      const laag = document.getElementById("ballLayer");
      if (!laag || laag.dataset.gevuld) return;
      laag.dataset.gevuld = "true";

      for (let i = 0; i < aantal; i++) {
        const bal = document.createElement("div");
        bal.className = "ball";
        bal.textContent = Math.floor(Math.random() * 90) + 1;
        bal.style.left = Math.random() * 96 + "%";
        bal.style.background = BAL_KLEUREN[i % BAL_KLEUREN.length];

        const duur = 6 + Math.random() * 6; // 6s - 12s to fall
        const vertraging = Math.random() * 10; // stagger start
        const spinDuur = 2 + Math.random() * 3;

        bal.style.animationDuration = `${duur}s, ${spinDuur}s`;
        bal.style.animationDelay = `${vertraging}s, 0s`;

        laag.appendChild(bal);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById("bingoGrid");

      for (let i = 1; i <= 99; i++) {
        const vakje = document.createElement("div");
        vakje.className = "cell vakje";
        vakje.dataset.id = i;
        vakje.id = `cell-${i}`;
        vakje.textContent = i;
        grid.appendChild(vakje);
      }

      maakVallendeBallen();

      db.ref("spelGestart").on("value", (snapshot) => {
        spelGestart = snapshot.val();
        updateOverlay();
      });

      db.ref("nummers").on("value", (snapshot) => {
        nummers = snapshot.val() || {};
        updateOverlay();

        const vakjes = document.querySelectorAll(".vakje");
        vakjes.forEach((vakje) => {
          const nummer = vakje.dataset.id;
          if (nummers[nummer]) {
            vakje.classList.add("getrokken");
          } else {
            vakje.classList.remove("getrokken");
          }
        });
      });
    });
  </script>
</head>
<body>
  <div id="overlay">
    <div id="ballLayer"></div>
    <div class="overlay-content">
      <h2>Smul gerust maar net als wij van de heerlijke mosseltjes want straks is het Bingotijd!!</h2>
    </div>
  </div>

  <div id="bingoContainer" style="display: none;">
   <img src="https://https://imgur.com/VBE44yg.png" style="max-width: 400px; height: auto; display: block; margin: 0 auto;">
    <h1>Bingo Stasegem Kermis 2026!</h1>
    <p>Live getrokken nummers</p>
    <div class="grid" id="bingoGrid"></div>
  </div>
</body>
</html>
